<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>时间循环：MD数据驱动版</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { display: grid; grid-template-columns: 250px 1fr 300px; height: 100vh; margin: 0; background: #f4f1ea; font-family: "serif"; color: #333; }
        
        .panel { padding: 20px; overflow-y: auto; }
        #left-panel { background: #e2dfd8; border-right: 2px solid #ccc; position: relative; }
        #center-panel { padding: 40px; position: relative; line-height: 1.8; font-size: 1.1rem; }
        #right-panel { background: #e2dfd8; border-left: 2px solid #ccc; }

        #time-display { position: absolute; top: 10px; left: 10px; font-size: 1.5rem; font-weight: bold; color: #8b0000; border: 2px solid #8b0000; padding: 5px 15px; border-radius: 5px; background: white; }
        #nav-bar { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
        .nav-btn { margin-right: 10px; padding: 5px 10px; cursor: pointer; }

        .char-card { background: white; padding: 10px; margin-bottom: 10px; border-radius: 4px; border-left: 4px solid #555; }
        
        /* 对话框与调查框通用样式 */
        #dialogue-box { background: #222; color: #eee; padding: 25px; border-radius: 8px; margin-top: 30px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #dialogue-box h4 { margin: 0 0 10px 0; color: #d4af37; border-bottom: 1px solid #444; padding-bottom: 5px; }
        #dialogue-box p { margin-bottom: 0; }
        
        .interact { color: #2a5caa; cursor: pointer; font-weight: bold; text-decoration: underline; }
        .keyword { color: #8b0000; cursor: pointer; font-weight: bold; padding: 0 4px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .keyword:hover { border-bottom: 2px solid #8b0000; background: rgba(139,0,0,0.1); }
        
        .keyword-item { display: inline-block; background: #8b0000; color: white; padding: 8px 12px; margin: 5px; border-radius: 4px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: all 0.1s; user-select: none; }
        .keyword-item:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .keyword-item.selected { outline: 3px solid #ffaa00; background: #5a0000; }
        .keyword-slot { display: inline-block; min-width: 60px; border-bottom: 2px dashed #8b0000; margin: 0 5px; text-align: center; cursor: pointer; color: #8b0000; font-weight: bold; padding-bottom: 2px; }
    </style>
</head>
<body>

    <div id="left-panel" class="panel">
        <div id="time-display">09:00</div>
        <h3 style="margin-top: 60px;">人物档案</h3>
        <div id="char-list"></div>
    </div>

    <div id="center-panel" class="panel">
        <div id="nav-bar"></div>
        <h2 id="loc-name"></h2>
        
        <div id="story-text">加载中...</div>
        
        <div id="npc-area" style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ccc;"></div>
        
        <div id="dialogue-box">
            <h4 id="speaker"></h4>
            <div id="content"></div>
            <button onclick="closeDialogue()" style="margin-top: 15px; padding: 5px 15px;">关闭</button>
        </div>
    </div>

    <div id="right-panel" class="panel">
        <h3>解密区域</h3>
        <div id="puzzle-area"></div>
        <button onclick="checkWin()" style="margin-top:20px; padding: 10px; width: 100%;">验证真相</button>
        <hr style="margin: 20px 0;">
        <h3>线索记录</h3>
        <div id="inventory"></div>
    </div>

    <script>
        let db = null;
        let mdCache = {}; // 用于缓存已加载的MD文件，避免重复请求
        
        let state = {
            time: 540,
            location: "",
            flags: {},
            unlockedChars: [],
            keywords: [],
            selectedKeyword: null
        };

        // --- 工具函数：读取并解析 MD 文件 ---
        async function fetchMD(path) {
            if (mdCache[path]) return mdCache[path]; // 如果缓存里有，直接用
            try {
                const res = await fetch(path);
                const text = await res.text();
                const html = marked.parse(text);
                mdCache[path] = html;
                return html;
            } catch (err) {
                console.error("加载MD失败:", path);
                return `<p style="color:red;">无法加载文件: ${path}</p>`;
            }
        }

        async function initGame() {
            const res = await fetch('./data/config.json');
            db = await res.json();
            renderNav();
            renderPuzzle();
            startDay();
        }

        function startDay() {
            state.time = db.startState.time;
            state.location = db.startState.location;
            state.flags = {}; 
            updateUI();
        }

        function formatTime(minutes) {
            const h = Math.floor(minutes / 60).toString().padStart(2, '0');
            const m = (minutes % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function advanceTime(minutes) {
            state.time += minutes;
            updateTimeDisplay();
        }

        function updateTimeDisplay() {
            document.getElementById('time-display').innerText = formatTime(state.time);
        }

        function changeLocation(locId) {
            state.location = locId;
            advanceTime(10);
            updateUI();
        }

        // --- 核心：渲染 UI 与解析场景 ---
        async function updateUI() {
            updateTimeDisplay();
            closeDialogue();
            
            const locData = db.locations[state.location];
            document.getElementById('loc-name').innerText = locData.name;
            
            // 异步加载当前场景的 MD 文本
            const sceneHTML = await fetchMD(`./data/scenes/${locData.file}`);
            document.getElementById('story-text').innerHTML = sceneHTML;

            // 渲染该地点的 NPC
            let npcHTML = "";
            for (let charId in db.characters) {
                const char = db.characters[charId];
                const activeSchedule = char.schedules.find(s => 
                    state.time >= s.start && state.time < s.end &&
                    (!s.reqFlag || state.flags[s.reqFlag]) &&
                    (!s.excludeFlag || !state.flags[s.excludeFlag])
                );

                if (activeSchedule && activeSchedule.loc === state.location) {
                    npcHTML += `<p>你在这里看到了 <span class='interact' onclick='talkTo("${charId}")'>${char.name}</span>。</p>`;
                }
            }
            document.getElementById('npc-area').innerHTML = npcHTML;
        }

        function renderNav() {
            let html = "";
            for (let locId in db.locations) {
                html += `<button class="nav-btn" onclick="changeLocation('${locId}')">前往${db.locations[locId].name}</button>`;
            }
            document.getElementById('nav-bar').innerHTML = html;
        }

        // --- 交互系统：对话与物品调查 ---
        
        // 角色对话（支持多级分支，topic默认为"default"）
        async function talkTo(charId, topicId = "default") {
            event.stopPropagation();
            if (!state.unlockedChars.includes(charId)) {
                state.unlockedChars.push(charId);
                renderProfiles();
            }

            const char = db.characters[charId];
            const diagData = char.dialogues[topicId];
            
            if (!diagData) return alert("没有找到对话数据：" + topicId);

            document.getElementById('dialogue-box').style.display = 'block';
            document.getElementById('speaker').innerText = `与 ${char.name} 对话`;
            
            // 加载对话的 MD 文件
            document.getElementById('content').innerHTML = await fetchMD(`./data/dialogues/${diagData.file}`);

            if (diagData.setFlag) state.flags[diagData.setFlag] = true;
            if (diagData.cost) advanceTime(diagData.cost);
        }

        // 物品调查
        async function investigate(itemId) {
            event.stopPropagation();
            const itemData = db.items[itemId];
            if (!itemData) return;

            document.getElementById('dialogue-box').style.display = 'block';
            document.getElementById('speaker').innerText = "调查线索";
            
            // 加载物品描述的 MD 文件
            document.getElementById('content').innerHTML = await fetchMD(`./data/dialogues/${itemData.file}`);

            if (itemData.cost) advanceTime(itemData.cost);
        }

        function closeDialogue() {
            document.getElementById('dialogue-box').style.display = 'none';
        }

        // --- 档案与解密 ---

        function renderProfiles() {
            const list = document.getElementById('char-list');
            list.innerHTML = state.unlockedChars.map(id => `
                <div class="char-card">
                    <strong>${db.characters[id].name}</strong><br>
                    <small>${db.characters[id].profile}</small>
                </div>
            `).join('');
        }

        function collectKeyword(word) {
            event.stopPropagation();
            if (!state.keywords.includes(word)) {
                state.keywords.push(word);
                renderInventory();
            }
        }

        function renderInventory() {
            const div = document.getElementById('inventory');
            div.innerHTML = state.keywords.map(w => 
                `<span class="keyword-item" onclick="selectKeyword(this, '${w}')">${w}</span>`
            ).join('');
        }

        function selectKeyword(element, word) {
            state.selectedKeyword = word;
            document.querySelectorAll('.keyword-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function renderPuzzle() {
            let html = db.puzzle.template;
            Object.keys(db.puzzle.answers).forEach(key => {
                html = html.replace(`{${key}}`, `<span class="keyword-slot" id="slot-${key}" onclick="fillSlot(this)">____</span>`);
            });
            document.getElementById('puzzle-area').innerHTML = html;
        }

        function fillSlot(el) {
            if (state.selectedKeyword) {
                el.innerText = state.selectedKeyword;
                state.selectedKeyword = null;
                document.querySelectorAll('.keyword-item').forEach(el => el.classList.remove('selected'));
            } else {
                el.innerText = "____";
            }
        }

        function checkWin() {
            let isWin = true;
            Object.keys(db.puzzle.answers).forEach(key => {
                if (document.getElementById(`slot-${key}`).innerText !== db.puzzle.answers[key]) isWin = false;
            });
            if (isWin) alert("真相大白！");
            else { alert("线索不匹配..."); advanceTime(5); }
        }

        window.onload = initGame;
    </script>
</body>
</html>
